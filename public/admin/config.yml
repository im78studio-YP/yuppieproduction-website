# Decap CMS configuration
backend:
  name: github
  repo: im78studio-YP/yuppieproduction-website
  branch: main
  base_url: https://yuppie-decap-oauth.im78studio.workers.dev
  auth_endpoint: /auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "en"

collections:
  # ---------- ผลงาน ----------
  - name: "projects"
    label: "ผลงาน (Projects)"
    label_singular: "ผลงาน"
    folder: "content/projects"
    create: true
    slug: "{{fields.number}}"
    extension: "json"
    format: "json"
    summary: "{{fields.number}} — {{fields.name}}"
    sortable_fields: ["number"]
    fields:
      - { name: "number", label: "ลำดับ (เช่น 01)", widget: "string" }
      - { name: "category", label: "ประเภท (พิมพ์เอง ใส่หรือไม่ใส่ก็ได้)", widget: "string", required: false }
      - { name: "name", label: "ชื่อโปรเจกต์", widget: "string" }
      - name: "images"
        label: "ภาพบูธ"
        widget: "list"
        required: false
        field: { name: "image", label: "ภาพ", widget: "image" }

  # ---------- บริการ ----------
  - name: "services"
    label: "บริการ (Services)"
    label_singular: "บริการ"
    folder: "content/services"
    create: true
    slug: "{{fields.number}}"
    extension: "json"
    format: "json"
    summary: "{{fields.number}} — {{fields.name}}"
    sortable_fields: ["number"]
    fields:
      - { name: "number", label: "ลำดับ (เช่น 01)", widget: "string" }
      - { name: "name", label: "ชื่อบริการ", widget: "string" }
      - { name: "description", label: "คำอธิบาย", widget: "text" }

  # ---------- ตั้งค่าเว็บ (2 บรรทัด: ข้อความ / รูปภาพ) ----------
  - name: "settings"
    label: "ตั้งค่าเว็บ (Site Settings)"
    files:
      - name: "site"
        label: "ข้อความหลักของเว็บ"
        file: "content/settings/site.json"
        fields:
          - { name: "menuAbout", label: "เมนู 1 — เกี่ยวกับเรา", widget: "string" }
          - { name: "menuServices", label: "เมนู 2 — บริการ", widget: "string" }
          - { name: "menuProjects", label: "เมนู 3 — ผลงาน", widget: "string" }
          - { name: "menuContact", label: "เมนู 4 — ติดต่อ", widget: "string" }
          - { name: "heroHeading", label: "หัวข้อใหญ่ (Hero)", widget: "string" }
          - { name: "heroTagline", label: "ประโยคใต้หัวข้อ (Hero)", widget: "text" }
          - { name: "heroButton", label: "ปุ่มติดต่อ (Hero)", widget: "string" }
          - { name: "aboutHeading", label: "หัวข้อ — เกี่ยวกับเรา", widget: "string" }
          - { name: "aboutText", label: "ข้อความ — เกี่ยวกับเรา", widget: "text" }
          - { name: "aboutButton", label: "ปุ่ม — เกี่ยวกับเรา", widget: "string" }
          - { name: "servicesHeading", label: "หัวข้อ — บริการ", widget: "string" }
          - { name: "projectsHeading", label: "หัวข้อ — ผลงาน", widget: "string" }
          - { name: "ctaLine1", label: "ปิดท้าย บรรทัด 1", widget: "string" }
          - { name: "ctaLine2", label: "ปิดท้าย บรรทัด 2", widget: "string" }
          - { name: "contactButton", label: "ปุ่มติดต่อ (ท้ายเว็บ)", widget: "string" }
          - { name: "contactEmail", label: "อีเมลติดต่อ", widget: "string" }
          - { name: "companyName", label: "ชื่อบริษัท (ท้ายเว็บ)", widget: "string" }
          - { name: "lineLink", label: "ลิงก์ LINE OA (เช่น https://lin.ee/xxxx — เว้นว่าง=ซ่อนปุ่ม)", widget: "string", required: false }
          - { name: "lineQR", label: "QR code LINE (อัปรูป QR — เว้นว่าง=ไม่โชว์)", widget: "image", required: false }
          - { name: "followHeading", label: "หัวข้อติดตามผลงาน (ท้ายเว็บ)", widget: "string", required: false, default: "ติดตามผลงานทีมยัพพี ได้ที่ :" }
          - { name: "facebookUrl", label: "ลิงก์ Facebook Page (เว้นว่าง=ซ่อนไอคอน)", widget: "string", required: false }
          - { name: "instagramUrl", label: "ลิงก์ Instagram", widget: "string", required: false }
          - { name: "tiktokUrl", label: "ลิงก์ TikTok", widget: "string", required: false }
          - { name: "linkedinUrl", label: "ลิงก์ LinkedIn", widget: "string", required: false }
          - name: "phones"
            label: "เบอร์โทร (ใส่ได้หลายเบอร์ เว้นว่างได้)"
            widget: "list"
            required: false
            field: { name: "number", label: "เบอร์", widget: "string" }

      - name: "popup"
        label: "Pop-up ประกาศ / โปรโมชั่น"
        file: "content/settings/popup.json"
        fields:
          - { name: "enabled", label: "เปิดใช้งาน Pop-up (ปิด=ไม่เด้ง)", widget: "boolean", default: false }
          - { name: "image", label: "รูปภาพ เช่น โปสเตอร์ (เว้นว่างได้)", widget: "image", required: false }
          - { name: "title", label: "หัวข้อ (เว้นว่างได้)", widget: "string", required: false }
          - { name: "body", label: "ข้อความ (เว้นว่างได้)", widget: "text", required: false }
          - { name: "buttonLabel", label: "ข้อความบนปุ่ม (เว้นว่าง=ไม่มีปุ่ม)", widget: "string", required: false }
          - { name: "buttonLink", label: "ลิงก์ปุ่ม เช่น LINE/เพจ (เว้นว่างได้)", widget: "string", required: false }
