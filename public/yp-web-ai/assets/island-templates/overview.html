<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuppie · Island Templates</title><style>*{box-sizing:border-box}body{margin:0;background:#efebe5;color:#262d33;font:15px/1.7 Tahoma,sans-serif}main{max-width:1100px;margin:auto;padding:32px}small{color:#b92367;letter-spacing:2px}h1{font:700 40px Arial,sans-serif}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid #d9d4cf;border-radius:14px;overflow:hidden}.card img{width:100%;display:block}.copy{padding:24px}.use-template{display:inline-flex;padding:10px 24px;background:#f72585;color:white;text-decoration:none;border-radius:10px;font-weight:bold}.use-template:focus-visible{outline:3px solid #252b32;outline-offset:3px}footer{margin-top:30px;border-top:1px solid #ccc;padding-top:20px}@media(max-width:700px){main{padding:18px}h1{font-size:28px}.cards{grid-template-columns:1fr}}</style></head><body><main><small>YUPPIE PRODUCTION / ISLAND COLLECTION</small><h1>ISLAND / 06 × 06</h1><p>กว้าง 6 × ลึก 6 × สูงประมาณ 3–3.5 ม. ตามแบบ · เปิดทั้ง 4 ด้าน · ใช้โลโก้ YP ตั้งต้น</p><section class="cards" id="cards" aria-label="เทมเพลต Island"></section><footer>ภาพเรนเดอร์จากโมเดลในเว็บ · สัดส่วนประมาณจากภาพอ้างอิง ไม่ใช่แบบผลิต ต้องตรวจโครงสร้างรับน้ำหนักซุ้ม จุดยึด ระยะใช้งาน และกฎผู้จัดก่อนผลิต<br><a href="../../index.html">เปิดตัวออกแบบบูธ</a></footer></main><script src="../../js/island-templates.js?v=20260911-yellow"></script><script>for(const t of YPIslandTemplates.templates){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=t.id+'.png?v=20260911-yellow';img.alt=t.name+' ขนาด 6 × 6 เมตร';const copy=document.createElement('div');copy.className='copy';const title=document.createElement('h2');title.textContent=t.name;const description=document.createElement('p');description.textContent=t.description;const link=document.createElement('a');link.className='use-template';link.href='../../index.html?useTemplate='+encodeURIComponent(t.id);link.textContent='ใช้แบบนี้';copy.append(title,description,link);card.append(img,copy);document.getElementById('cards').append(card);}</script></body></html>
